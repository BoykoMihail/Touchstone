name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (Xcode)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - run: swift build --build-tests
      - run: swift test

  linux:
    name: Linux (no Apple SDK)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      # Keeps a promise from the README: the core depends on no platform SDK,
      # so it must build and test where FoundationModels does not exist at all.
      # Red here means the core grew an Apple dependency — a design regression.
      - run: swift build --build-tests
      - run: swift test
